<!DOCTYPE html>
<html>
<head>
    <title>Payment</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="navbar">
    <div class="logo">🍽️ Smart Restaurant</div>
</div>

<div class="container">
<h2>💳 Payment</h2>

<form onsubmit="pay(event)" autocomplete="off">

    <input type="text" id="cardNo" maxlength="12" 
           oninput="this.value = this.value.replace(/[^0-9]/g, '')"
           placeholder="Card Number" required>

    <input type="text" id="expiry" maxlength="5"
           placeholder="MM/YY" required>

    <input type="text" id="cvv" maxlength="3"
           oninput="this.value = this.value.replace(/[^0-9]/g, '')"
           placeholder="CVV" required>

    <button type="submit">Pay Now</button>

</form>
</div>

<script src="script.js"></script>

</body>
</html>
